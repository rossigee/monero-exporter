project_name: monero-exporter

builds:
  - id: monero-exporter
    main: ./cmd/monero-exporter
    env:
      - CGO_ENABLED=0
    binary: monero-exporter
    ldflags:
      - -w -s -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

dockers:
  - image_templates:
      - "ghcr.io/rossigee/monero-exporter:{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
  - image_templates:
      - "ghcr.io/rossigee/monero-exporter:{{ .Version }}-arm64v8"
    use: buildx
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64/v8"

docker_manifests:
  - name_template: "ghcr.io/rossigee/monero-exporter:{{ .Version }}"
    image_templates:
      - "ghcr.io/rossigee/monero-exporter:{{ .Version }}-amd64"
      - "ghcr.io/rossigee/monero-exporter:{{ .Version }}-arm64v8"
  - name_template: "ghcr.io/rossigee/monero-exporter:latest"
    image_templates:
      - "ghcr.io/rossigee/monero-exporter:{{ .Version }}-amd64"
      - "ghcr.io/rossigee/monero-exporter:{{ .Version }}-arm64v8"
